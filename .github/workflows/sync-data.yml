name: Hourly Data Sync to Firebase

# Job nhẹ chạy mỗi giờ: chỉ sync data lên Firebase, KHÔNG build/deploy.
# App đọc data tươi từ Firebase RTDB ở runtime nên không cần rebuild mỗi giờ.
on:
  schedule:
    # Mỗi 1 tiếng 1 lần
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép trigger bằng tay

permissions:
  contents: read

concurrency:
  group: sync-data-firebase
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Upharma Data to Firebase
        env:
          UPHARMA_USERNAME: ${{ secrets.UPHARMA_USERNAME }}
          UPHARMA_PASSWORD: ${{ secrets.UPHARMA_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          UPHARMA_EXCLUDED_SHOPS: "SHOP0040,SHOP0162"
        run: node scripts/fetch-upharma-data.js
