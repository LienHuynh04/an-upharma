name: Deploy Angular to GitHub Pages with Cron Data Fetch

on:
  push:
    branches:
      - master
  schedule:
    # 0h UTC (7h sáng VN)
    - cron: '0 0 * * *'
    # Mỗi 1 tiếng 1 lần
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép trigger bằng tay

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch Upharma Static Data
        env:
          UPHARMA_USERNAME: ${{ secrets.UPHARMA_USERNAME }}
          UPHARMA_PASSWORD: ${{ secrets.UPHARMA_PASSWORD }}
          # Exclude SHOP0040 if needed, or define in secrets
          UPHARMA_EXCLUDED_SHOPS: "SHOP0040"
        run: node scripts/fetch-upharma-data.js

      - name: Build Angular Project
        run: npm run build -- --configuration production --base-href /an-upharma/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/upharma/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
