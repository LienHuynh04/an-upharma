name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch: # Cho phép trigger bằng tay

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch Upharma Static Data (fallback bundle)
        env:
          UPHARMA_USERNAME: ${{ secrets.UPHARMA_USERNAME }}
          UPHARMA_PASSWORD: ${{ secrets.UPHARMA_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          # Exclude SHOP0040 if needed, or define in secrets
          UPHARMA_EXCLUDED_SHOPS: "SHOP0040"
        run: node scripts/fetch-upharma-data.js
      
      - name: Inject Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is empty or unavailable. Configure it as a GitHub Actions secret."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const path = "src/environments/environment.prod.ts";
          const source = fs.readFileSync(path, "utf8");
          const placeholder = /^(\s*geminiApiKey:\s*)""/m;

          if (!placeholder.test(source)) {
            throw new Error(`Could not find the empty geminiApiKey in ${path}`);
          }

          fs.writeFileSync(
            path,
            source.replace(placeholder, (_match, prefix) =>
              `${prefix}${JSON.stringify(process.env.GEMINI_API_KEY)}`
            )
          );
          NODE

      - name: Build Angular Project
        run: npm run build -- --configuration production --base-href /an-upharma/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/upharma/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
