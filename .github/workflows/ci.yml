name: CI - Build Check

# Chạy kiểm tra mỗi khi mở/cập nhật Pull Request vào master,
# và mỗi khi push lên các branch feature/*, fix/*.
# Mục đích: phát hiện code gãy build TRƯỚC khi merge,
# để deploy production (deploy.yml) không bao giờ nhận code lỗi.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check sync scripts syntax
        run: |
          node --check scripts/fetch-upharma-data.js
          node --check scripts/sync-firebase-catalog.js

      - name: Build Angular Project (production)
        run: npx ng build --configuration production
