<div class="page">
  <!-- Combined Header & Navigation Bar -->
  <header class="navbar navbar-expand-md navbar-dark d-print-none" style="background: #0d172d; border-bottom: 1px solid rgba(255, 255, 255, 0.08); min-height: 56px; padding: 0.5rem 0;">
    <div class="container-xl">
      <!-- Hamburger for mobile menu toggling navigation -->
      <button
        class="navbar-toggler"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="appClasses['is-sidebar-open']"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Brand -->
      <h1 class="navbar-brand navbar-brand-autodark pe-0 pe-md-3 me-3">
        <a routerLink="/dashboard" class="text-decoration-none d-flex align-items-center text-white">
          <span class="avatar avatar-sm bg-primary text-white me-2" style="width: 32px; height: 32px; line-height: 32px; font-weight: bold;">U</span>
          <strong style="font-size: 18px; letter-spacing: 0.5px;">UPHARMA</strong>
        </a>
      </h1>

      <!-- Navigation Menu (inline on desktop, collapsible on mobile) -->
      <div class="collapse navbar-collapse" [class.show]="appClasses['is-sidebar-open']" id="navbar-menu">
        <div class="d-flex flex-column flex-md-row flex-fill align-items-stretch align-items-md-center justify-content-between">
          <ul class="navbar-nav align-items-md-center">
            <!-- Dashboard link -->
            <li class="nav-item">
              <a class="nav-link py-2" routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()">
                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-home" style="font-size: 1.1rem;"></i></span>
                <span class="nav-link-title" style="font-size: 13.5px;">Dashboard</span>
              </a>
            </li>

            <!-- Nhóm chỉ tiêu -->
            <li class="nav-item dropdown" [class.show]="openMenuId === 'stats'" [class.active]="menuGroups['stats']">
              <a
                class="nav-link dropdown-toggle py-2"
                href="javascript:void(0)"
                (click)="toggleMenuGroup('stats', $event)"
                [attr.aria-expanded]="openMenuId === 'stats'"
              >
                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-chart-bar" style="font-size: 1.1rem;"></i></span>
                <span class="nav-link-title" style="font-size: 13.5px;">Thống kê chỉ tiêu</span>
              </a>
              <div class="dropdown-menu" [class.show]="openMenuId === 'stats'" (click)="$event.stopPropagation()">
                <a
                  class="dropdown-item"
                  routerLink="/chi-tieu-nhan-vien"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Chỉ tiêu nhân viên</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/chi-tieu-nha-thuoc-trong-nam"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Chỉ tiêu nhà thuốc trong năm</a
                >
              </div>
            </li>

            <!-- Nhóm hàng hóa -->
            <li class="nav-item dropdown" [class.show]="openMenuId === 'goods'" [class.active]="menuGroups['goods']">
              <a
                class="nav-link dropdown-toggle py-2"
                href="javascript:void(0)"
                (click)="toggleMenuGroup('goods', $event)"
                [attr.aria-expanded]="openMenuId === 'goods'"
              >
                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-packages" style="font-size: 1.1rem;"></i></span>
                <span class="nav-link-title" style="font-size: 13.5px;">Hàng hóa</span>
              </a>
              <div class="dropdown-menu" [class.show]="openMenuId === 'goods'" (click)="$event.stopPropagation()">
                <a
                  class="dropdown-item"
                  routerLink="/ton-kho"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Tồn kho</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/lay-bao-cao-don-hang"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Lấy báo cáo đơn hàng</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/hang-da-het"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Hàng đã hết</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/hang-lap-tot"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Hàng lặp tốt</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/hang-ban-cham"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Hàng bán chậm</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/goi-y-chuyen-hang"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Gợi ý chuyển hàng cận hạn</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/in-tem"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >In tem</a
                >
              </div>
            </li>

            <!-- Nhóm hệ thống test
            <li class="nav-item dropdown" [class.show]="openMenuId === 'test'" [class.active]="menuGroups['test']">
              <a
                class="nav-link dropdown-toggle py-2"
                href="javascript:void(0)"
                (click)="toggleMenuGroup('test', $event)"
                [attr.aria-expanded]="openMenuId === 'test'"
              >
                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-flask" style="font-size: 1.1rem;"></i></span>
                <span class="nav-link-title" style="font-size: 13.5px;">Hệ thống test</span>
              </a>
              <div class="dropdown-menu" [class.show]="openMenuId === 'test'" (click)="$event.stopPropagation()">
                <a
                  class="dropdown-item"
                  routerLink="/inventory-system-test"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Test GetInventoryShop</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/inventory-expiration-test"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Test GetInventoryExpiration</a
                >
                <a
                  class="dropdown-item"
                  routerLink="/api-test"
                  routerLinkActive="active"
                  (click)="closeSidebar(); openMenuId = null"
                  >Test tốc độ tiêu thụ</a
                >
              </div>
            </li>
            -->
          </ul>
        </div>
      </div>

      <!-- Right actions (Theme, notification, user dropdown) -->
      <div class="navbar-nav flex-row order-md-last align-items-center ms-auto gap-2">
        <!-- Report button -->
        <div class="nav-item d-none d-sm-block">
          <button
            class="btn btn-sm btn-primary"
            type="button"
            [disabled]="generatingReport"
            (click)="generateAndOpenReport()"
            style="font-size: 12px; font-weight: bold; padding: 4px 10px;"
          >
            📊 {{ generatingReport ? "Đang tạo..." : "Báo cáo" }}
          </button>
        </div>

        <!-- Theme toggle -->
        <div class="nav-item">
          <button
            class="btn btn-icon btn-ghost-light border-0 p-0 text-white-50"
            type="button"
            (click)="toggleDarkMode()"
            [title]="darkMode ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'"
            style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"
          >
            <i class="ti" [class.ti-sun]="darkMode" [class.ti-moon]="!darkMode" style="font-size: 1.25rem;"></i>
          </button>
        </div>

        <!-- Logout icon directly next to avatar -->
        <div class="nav-item">
          <button
            class="btn btn-ghost-danger btn-icon border-0 p-0"
            type="button"
            aria-label="Đăng xuất"
            title="Đăng xuất"
            (click)="openLogoutConfirm($event)"
            style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"
          >
            <i class="ti ti-logout" style="font-size: 1.2rem;"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Wrapper -->
  <div class="page-wrapper" style="padding-top: 0px;">
    <!-- Main Content Area -->
    <div class="page-body m-0 p-0">
      <div class="container-xl page-content-wrapper">
        <router-outlet (activate)="onActivate($event)" (deactivate)="onDeactivate()"></router-outlet>
      </div>
    </div>
  </div>
</div>

<!-- Logout Confirm Modal -->
<div
  class="modal modal-blur fade show"
  *ngIf="showLogoutConfirm"
  style="display: block; background: rgba(0,0,0,0.5); z-index: 1050;"
  (click)="cancelLogout()"
>
  <div class="modal-dialog modal-sm modal-dialog-centered" role="document" (click)="$event.stopPropagation()">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-body text-center py-4">
        <div class="avatar avatar-lg bg-danger-lt text-danger mb-3"><i class="ti ti-logout" style="font-size: 24px;"></i></div>
        <h3>Đăng xuất</h3>
        <div class="text-muted">Bạn có chắc chắn muốn đăng xuất khỏi UPHARMA không?</div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <div class="w-100">
          <div class="row">
            <div class="col">
              <button class="btn btn-link w-100 text-muted text-decoration-none" (click)="cancelLogout()">
                Hủy
              </button>
            </div>
            <div class="col">
              <button class="btn btn-danger w-100" (click)="confirmLogout()">
                Đăng xuất
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
