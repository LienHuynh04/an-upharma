<main class="dashboard-page">
  <header class="dashboard-heading">
    <div>
      <span>TỔNG QUAN</span>
      <h1>Dashboard</h1>
      <p>Biểu đồ doanh số theo ca và top sản phẩm theo shop.</p>
    </div>
    <div class="dashboard-actions">
      <label>
        Shop
        <select [(ngModel)]="activeShopCode">
          <option *ngFor="let shop of shops" [ngValue]="shop.ShopCode">{{ shop.ShopCode }} - {{ shop.ShopName }}</option>
        </select>
      </label>
      <label>
        Từ
        <input [(ngModel)]="selectedStartDate" type="date" />
      </label>
      <label>
        Đến
        <input [(ngModel)]="selectedEndDate" type="date" />
      </label>
      <button type="button" class="dashboard-view-btn" (click)="loadDashboard()">Xem</button>
    </div>
  </header>

  <p class="api-test-error" *ngIf="dashboardErrorText">{{ dashboardErrorText }}</p>
  <section class="dashboard-shell" *ngIf="!dashboardErrorText">
    <article class="dashboard-card dashboard-card-chart">
      <header><h2>Doanh số bán hàng theo ca</h2></header>
      <div class="chart-wrap">
        <div class="chart-loading" *ngIf="chartLoading">
          <span class="loader" aria-hidden="true"></span>
          <strong>Đang tải biểu đồ...</strong>
        </div>
        <canvas #salesChartCanvas></canvas>
      </div>
    </article>

    <article class="dashboard-card dashboard-card-top">
      <div class="top3-header">
        <div class="title">
          <span class="mdi mdi-trophy"></span>
          <p>Top 5 sản phẩm doanh số cao</p>
        </div>
      </div>
      <div class="line-honizontal"></div>
      <div class="top3-list">
        <div
          *ngFor="let item of topProductSales; let index = index"
          class="top3-cell"
          [style.--color-bg]="getTopProductBg(index)"
        >
          <div [class.top3-celltop1]="index === 0">
            <div>
              <p>{{ getTopProductRank(index) }}. {{ item.ProductName }}</p>
              <div class="money-order">
                <p>Doanh số: <span>{{ formatMoney(item.Amount) }}</span></p>
              </div>
            </div>
            <div *ngIf="index === 0">
              <span class="mdi mdi-star icon-star"></span>
            </div>
          </div>
        </div>
      </div>
    </article>
  </section>

  <div class="dashboard-loading" *ngIf="dashboardLoading && !customerNewLst.length">
    <span class="loader" aria-hidden="true"></span>
    <strong>Đang tải dashboard...</strong>
  </div>
</main>
